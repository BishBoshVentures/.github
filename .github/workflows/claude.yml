name: Claude Code (reusable)

on:
  workflow_call:
    # Declared so a caller OUTSIDE this org (e.g. jamesbishbosh/Careering, moved
    # to a personal account) can pass the key explicitly: `secrets: inherit`
    # only reaches reusable workflows in the same organisation or enterprise.
    # Optional, so org repos that use `secrets: inherit` keep working unchanged.
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pin a current model, as codex-autofix.yml does. Without it the action
          # falls back to its retired default (claude-sonnet-4-20250514) and every
          # @claude run fails with API Error 404 not_found_error (seen on
          # jamesbishbosh/Careering run 34614526373, 11 Sep 2026).
          model: claude-sonnet-4-6
